<!doctype html>
<html lang="ja" oncontextmenu="return false;">
  <head>
    <meta charset="UTF-8" />
    <title>Avoider Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <canvas id="game" width="1120" height="630"></canvas>
      <form id="scoreEntry">
        <label for="playerName">名前を入力</label>
        <input id="playerName" type="text" maxlength="12" autocomplete="off" required />
        <button type="submit">登録</button>
      </form>
      <button id="rankingBtn">ランキング</button>
      <button id="restartBtn">もう一度</button>
      <section id="rankingPanel" aria-labelledby="rankingTitle">
        <h2 id="rankingTitle">ランキング</h2>
        <ol id="rankingList"></ol>
        <button id="rankingCloseBtn" type="button">閉じる</button>
      </section>
    <script src="main.js"></script>
  </body>
</html>
